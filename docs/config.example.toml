# relay settings: ~/.relay/config.toml, or $RELAY_HOME/config.toml.
# relay never stores passwords, tokens or API keys in this file.

version = 1

[defaults]
# The account `relay run` uses when you do not name one.
account = "claude:personal"

[log]
# debug, info, warn or error. --log-level and RELAY_LOG_LEVEL win over this.
level = "info"

[checkpoint]
# Files larger than this many MB (1 to 1024) are left out of checkpoints.
max_file_size_mb = 20

# An account is a provider and a name you choose. Each account has its own
# profile folder, where the provider's own program keeps its sign-in.
[accounts."claude:personal"]
profile_dir = "~/.claude"
kind = "personal"

[accounts."claude:startup"]
# Without profile_dir, the folder is ~/.relay/profiles/claude-startup.
kind = "work"

[accounts."codex:personal"]
profile_dir = "~/.codex"
# Names of credential variables this account may receive from your shell.
# relay removes every other credential variable when it starts an agent.
credential_env = []

# The accounts allowed to see each project. Handing work to an account sends
# the project's code to that account's company.
[[projects]]
path = "~/projects/relay"
allow = ["claude:personal", "codex:personal"]

# Connect only to T3 Code on this computer. The token stays in the credential store.
[t3]
url = "http://127.0.0.1:3773/mcp"
# relay may manage threads in these project folders.
projects = ["~/projects/relay"]

# Map each T3 provider instance to the relay account it uses.
[t3.instances.claude]
account = "claude:personal"

[t3.instances.codex]
account = "codex:personal"
model = "gpt-6.1-sol"

# Keep 10 percent of the weekly Claude limit. A target defaults the action to switch.
[limits."claude:personal".seven_day]
threshold = 90
switch_to = "codex:personal"

# How relay switch hands a job to another agent. These are the defaults.
[handoff]
# Ask the outgoing agent for handoff notes. It costs a little usage on its account.
ask_for_summary = true
summary_timeout_seconds = 120
stop_timeout_seconds = 30
check_timeout_seconds = 600
start_check_seconds = 5
