<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>Your relay license · relay</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css">
<script src="/license/license.js" defer></script>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <defs>
    <symbol id="g" viewBox="0 0 16 12"><path d="M0 3.2 H8.2 V8.8 H16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <nav class="site-nav" aria-label="Site">
    <a class="wordmark" href="/"><svg class="glyph" aria-hidden="true"><use href="#g"/></svg>relay</a>
    <span class="spacer"></span>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.25 12.4A6.75 6.75 0 0 1 7.6 3.75a6.75 6.75 0 1 0 8.65 8.65Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.25"/><path d="M10 2.25v1.5M10 16.25v1.5M2.25 10h1.5M16.25 10h1.5M4.52 4.52l1.06 1.06M14.42 14.42l1.06 1.06M4.52 15.48l1.06-1.06M14.42 5.58l1.06-1.06"/></g></svg>
    </button>
  </nav>
</div>
<main class="wrap license">
  <h1 class="display">Your relay license</h1>
  <noscript><p>This page needs JavaScript to show your key.</p></noscript>
  <p id="license-state" role="status" hidden></p>
  <div id="license-issued" class="license-issued" hidden>
    <div class="license-block">
      <div class="license-block-head">
        <h2 id="license-key-title">License key</h2>
        <button type="button" class="btn btn-secondary btn-sm" data-copy="license-key">Copy key</button>
      </div>
      <pre id="license-key" class="license-text" tabindex="0" aria-labelledby="license-key-title"></pre>
    </div>
    <div class="license-block">
      <div class="license-block-head">
        <h2 id="license-command-title">Activate it in a terminal:</h2>
        <button type="button" class="btn btn-secondary btn-sm" data-copy="license-command">Copy command</button>
      </div>
      <pre id="license-command" class="license-text" tabindex="0" aria-labelledby="license-command-title"></pre>
    </div>
    <p class="license-note">Save this key somewhere safe. relay checks it on your computer and never sends it anywhere. This page shows the same key again if you open it later.</p>
    <p class="sr-only" role="status" id="copy-status"></p>
  </div>
</main>
</body>
</html>
