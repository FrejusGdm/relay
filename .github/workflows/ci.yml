name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Install gitleaks 8.30.1 for the tests
        env:
          GITLEAKS_ARCHIVE: ${{ runner.os == 'macOS' && 'gitleaks_8.30.1_darwin_arm64.tar.gz' || 'gitleaks_8.30.1_linux_x64.tar.gz' }}
          GITLEAKS_SHA256: ${{ runner.os == 'macOS' && 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5' || '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GITLEAKS_ARCHIVE"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | shasum -a 256 --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: bun test
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: codesign -dv dist/relay-darwin-arm64
      - run: sh scripts/smoke-test.sh dist/relay-${{ matrix.target }} "$(bun -p 'require("./package.json").version')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.target }}
          path: dist/relay-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Every action is pinned to a commit SHA
        run: |
          if grep -rnE '^\s*(-\s*)?uses:' .github/workflows | grep -vE 'uses: [^@ ]+@[0-9a-f]{40} # v[0-9]'; then
            echo "Pin every action to a full commit SHA followed by a version comment."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun audit
      - name: Secret scan (gitleaks 8.30.1)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
